[workspace]
resolver = "3"
members = [
    # Re-added as each crate is ported to the 0.2 core (see OVERHAUL_LOG.md).
    "crates/protocol",
    "crates/core",
    "crates/tools",
    "crates/server",
]


[workspace.lints.clippy]
# Tools must not reach files, processes or the network except through the
# core's capabilities; crates/tools/clippy.toml lists the banned routes.
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Nebula MCP contributors"]
repository = "https://github.com/Meganugger/nebula-mcp"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Errors
thiserror = "1.0"

# Tracing / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

# Utilities
bytes = "1.7"
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
regex = "1.10"
notify = "6.1"
notify-debouncer-mini = "0.4"
which = "6.0"
cap-std = "4.0"
cap-fs-ext = "4.0"
time = { version = "0.3", features = ["formatting", "macros"] }
parking_lot = "0.12"
dashmap = "6.1"

# HTTP / network. The client is hyper over our own vetted TcpStream and a rustls
# config with an explicit aws-lc-rs provider (the only crypto provider in the graph).
http = "1.4"
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1.0.12"
libc = "0.2"
process-wrap = { version = "10.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
url = "2.5"

# Dev
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0
