[package]
name = "nebula-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt"] }

nebula-mcp-protocol = { path = "../crates/protocol" }
nebula-mcp-tools = { path = "../crates/tools" }

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "args_parser"
path = "fuzz_targets/args_parser.rs"
test = false
doc = false
bench = false
