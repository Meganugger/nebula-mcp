# Tools reach files, processes and the network only through the capabilities
# in nebula-mcp-core, which apply the policy. These bans make a bypass a lint
# error (the workspace denies clippy::disallowed_methods and
# clippy::disallowed_types).
disallowed-methods = [
    { path = "std::fs::read", reason = "use ctx.fs()" },
    { path = "std::fs::read_to_string", reason = "use ctx.fs()" },
    { path = "std::fs::read_dir", reason = "use ctx.fs()" },
    { path = "std::fs::read_link", reason = "use ctx.fs()" },
    { path = "std::fs::write", reason = "use ctx.fs()" },
    { path = "std::fs::copy", reason = "use ctx.fs()" },
    { path = "std::fs::rename", reason = "use ctx.fs()" },
    { path = "std::fs::remove_file", reason = "use ctx.fs()" },
    { path = "std::fs::remove_dir", reason = "use ctx.fs()" },
    { path = "std::fs::remove_dir_all", reason = "use ctx.fs()" },
    { path = "std::fs::create_dir", reason = "use ctx.fs()" },
    { path = "std::fs::create_dir_all", reason = "use ctx.fs()" },
    { path = "std::fs::metadata", reason = "use ctx.fs()" },
    { path = "std::fs::symlink_metadata", reason = "use ctx.fs()" },
    { path = "std::fs::canonicalize", reason = "use ctx.fs()" },
    { path = "std::fs::set_permissions", reason = "use ctx.fs()" },
    { path = "std::fs::hard_link", reason = "use ctx.fs()" },
    { path = "std::fs::File::open", reason = "use ctx.fs()" },
    { path = "std::fs::File::create", reason = "use ctx.fs()" },
    { path = "std::fs::File::create_new", reason = "use ctx.fs()" },
    { path = "std::fs::File::options", reason = "use ctx.fs()" },
    { path = "std::fs::OpenOptions::new", reason = "use ctx.fs()" },
    { path = "std::process::Command::new", reason = "use ctx.run() or ctx.spawn()" },
    { path = "tokio::process::Command::new", reason = "use ctx.run() or ctx.spawn()" },
    { path = "std::net::TcpStream::connect", reason = "use ctx.net()" },
    { path = "std::net::TcpStream::connect_timeout", reason = "use ctx.net()" },
    { path = "std::net::UdpSocket::bind", reason = "use ctx.net()" },
    { path = "std::net::TcpListener::bind", reason = "tools do not listen" },
    { path = "tokio::net::TcpStream::connect", reason = "use ctx.net()" },
    { path = "tokio::net::UdpSocket::bind", reason = "use ctx.net()" },
    { path = "tokio::net::TcpListener::bind", reason = "tools do not listen" },
    { path = "tokio::net::lookup_host", reason = "use ctx.net()" },
    { path = "std::env::var", reason = "tools do not read the server's environment; ask the context" },
    { path = "std::env::var_os", reason = "tools do not read the server's environment; ask the context" },
    { path = "std::env::vars", reason = "tools do not read the server's environment; ask the context" },
    { path = "std::env::vars_os", reason = "tools do not read the server's environment; ask the context" },
    { path = "std::env::set_var", reason = "the server's environment is not a tool's to change" },
    { path = "std::env::set_current_dir", reason = "the server's working directory is not a tool's to change" },
]
disallowed-types = [
    { path = "tokio::fs::File", reason = "use ctx.fs()" },
    { path = "tokio::fs::OpenOptions", reason = "use ctx.fs()" },
    { path = "tokio::fs::ReadDir", reason = "use ctx.fs()" },
]
