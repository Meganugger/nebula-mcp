[package]
name = "nebula-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nebula MCP: a Model Context Protocol server that gives an AI agent policy-checked control of a machine over stdio or HTTP."
default-run = "nebula-mcp"

[lib]
name = "nebula_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "nebula-mcp"
path = "src/main.rs"

[features]
default = []
# Export traces via OTLP/gRPC when `logging.otel_endpoint` is set.
otel = ["nebula-mcp-core/otel"]

[dependencies]
nebula-mcp-core = { path = "../core" }
nebula-mcp-tools = { path = "../tools" }

rmcp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "http1", "http2"] }
http-body = "1"
tower = { version = "0.5", features = ["util"] }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
