name: Release

# Builds release binaries for Linux, macOS and Windows on every version tag,
# publishes them to a GitHub release with SHA-256 checksums, and signs the
# checksum manifest with Sigstore cosign (keyless, via the workflow's OIDC
# identity — no long-lived signing secrets required).
#
# Verify a download:
#   sha256sum --check --ignore-missing SHA256SUMS
#   cosign verify-blob \
#     --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
#     --certificate-identity-regexp 'https://github.com/.*/.github/workflows/release.yml.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     SHA256SUMS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # cosign keyless signing

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p nebula-mcp-server
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="nebula-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/nebula-mcp" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE config/default.toml "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "nebula-mcp-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nebula-mcp.exe" $name/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE,config/default.toml $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            nebula-mcp-*.tar.gz
            nebula-mcp-*.zip
          if-no-files-found: error

  release:
    name: Checksum, sign, publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum nebula-mcp-* > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-certificate SHA256SUMS.pem \
            --output-signature SHA256SUMS.sig \
            SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
