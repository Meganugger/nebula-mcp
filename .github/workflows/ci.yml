name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux — build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release
      - name: OpenTelemetry feature builds
        run: cargo build -p nebula-mcp-server --features otel

  windows-crosscheck:
    name: Linux → Windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: Type-check Windows target
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  windows:
    name: Windows — build, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
      # Surface the failure details as check annotations so contributors
      # without a Windows machine can diagnose from the PR checks UI/API.
      - name: Surface failing tests
        if: failure()
        shell: bash
        run: |
          if [ -f test-output.txt ]; then
            summary=$(sed -n '/^failures:$/,$p' test-output.txt | head -c 3500)
            detail=$(grep -E "^---- .* stdout ----$" -A 25 test-output.txt | head -c 3500)
            encode() { printf '%s' "$1" | python3 -c 'import sys,urllib.parse; d=sys.stdin.read(); print(d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")'; }
            [ -n "$summary" ] && echo "::error title=Failing tests (summary)::$(encode "$summary")"
            [ -n "$detail" ] && echo "::error title=Failing tests (detail)::$(encode "$detail")"
          fi

  stress:
    name: Stress/soak — thousands of concurrent calls, both transports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stress tests (engine, stdio framing, HTTP transport)
        run: cargo test -p nebula-mcp-server --test stress --release -- --ignored --test-threads=1

  fuzz-smoke:
    name: Fuzz smoke — frame decoder & argument parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz frame decoder (60s)
        run: cargo +nightly fuzz run frame_decoder -- -max_total_time=60
      - name: Fuzz argument parsers (60s)
        run: cargo +nightly fuzz run args_parser -- -max_total_time=60
