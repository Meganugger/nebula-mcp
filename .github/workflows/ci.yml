name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux — build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test core config
        run: "cargo test -p nebula-mcp-core config::"
      - name: Test core context
        run: "cargo test -p nebula-mcp-core context::"
      - name: Test core security
        run: "cargo test -p nebula-mcp-core security::"
      - name: Test core error
        run: "cargo test -p nebula-mcp-core error::"
      - name: Test core metrics
        run: "cargo test -p nebula-mcp-core metrics::"
      - name: Test core tool
        run: "cargo test -p nebula-mcp-core tool::"
      - name: Test protocol
        run: cargo test -p nebula-mcp-protocol --all-targets
      - name: Test tools
        run: cargo test -p nebula-mcp-tools --all-targets
      - name: Test server
        run: cargo test -p nebula-mcp-server --all-targets
      - name: Generated tool documentation
        run: python3 scripts/check_tools_doc.py
      - name: Build release
        run: cargo build --release
      - name: OpenTelemetry feature builds
        run: cargo build -p nebula-mcp-server --features otel

  windows-crosscheck:
    name: Linux → Windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: Type-check Windows target
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  windows:
    name: Windows — build, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test core config
        run: "cargo test -p nebula-mcp-core config::"
      - name: Test core context
        run: "cargo test -p nebula-mcp-core context::"
      - name: Test core security
        run: "cargo test -p nebula-mcp-core security::"
      - name: Test core error
        run: "cargo test -p nebula-mcp-core error::"
      - name: Test core metrics
        run: "cargo test -p nebula-mcp-core metrics::"
      - name: Test core tool
        run: "cargo test -p nebula-mcp-core tool::"
      - name: Test protocol
        run: cargo test -p nebula-mcp-protocol --all-targets
      - name: Test tools
        run: cargo test -p nebula-mcp-tools --all-targets
      - name: Test server
        run: cargo test -p nebula-mcp-server --all-targets

  macos:
    name: macOS — build, test, lint
    # Keep the macOS lane on the supported Intel runner until arm64 native
    # dependency/toolchain coverage is explicitly added as a separate job.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test core config
        run: "cargo test -p nebula-mcp-core config::"
      - name: Test core context
        run: "cargo test -p nebula-mcp-core context::"
      - name: Test core security
        run: "cargo test -p nebula-mcp-core security::"
      - name: Test core error
        run: "cargo test -p nebula-mcp-core error::"
      - name: Test core metrics
        run: "cargo test -p nebula-mcp-core metrics::"
      - name: Test core tool
        run: "cargo test -p nebula-mcp-core tool::"
      - name: Test protocol
        run: cargo test -p nebula-mcp-protocol --all-targets
      - name: Test tools
        run: cargo test -p nebula-mcp-tools --all-targets
      - name: Test server
        run: cargo test -p nebula-mcp-server --all-targets
      - name: Build release
        run: cargo build --release

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check declared MSRV
        run: cargo check --workspace --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve patched RustSec dependencies
        run: rm -f Cargo.lock && cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
